<head>
  <meta charset="utf-8">
  <title>WETS · Editor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- One engine instance, one three. The app's own bundle, the engine's
       bundle and a scenario script's module all resolve "WebEngineTS" — and
       "three" — here, so TypeRegistry is shared (a script's classes reach the
       scene the editor deserializes) and there is no second copy of three. -->
  <script type="importmap">
    {
      "imports": {
        "WebEngineTS": "/editor/engine/WebEngineTS.esm.js",
        "three": "/editor/engine/three.module.js",
        "three/addons/": "/editor/engine/three-addons/",
        "three/examples/jsm/": "/editor/engine/three-addons/"
      }
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
