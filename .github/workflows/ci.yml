name: CI

on:
  push:
    # Branches only: a tag points at a commit some branch push already checked.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only, stated rather than inherited: on a push the token otherwise gets
# the repository's default permissions, which may include write. Nothing here
# writes to the repo; the artifact upload uses the Actions runtime token, not
# this one.
permissions:
  contents: read

# Every job below:
#
# - Checks out with persist-credentials: false. Nothing uses git after the
#   checkout, and the token should not stay on disk while `npm ci`, the
#   Angular build and Playwright's installer run third-party code.
# - Uses v7 of the actions. The v4s declare the end-of-life Node 20 runtime,
#   which runners still run, moved onto Node 24, with a deprecation warning
#   every run.
# - Has no npm cache: no `cache: npm`, and `package-manager-cache: false`,
#   since setup-node v6 and later turn the cache on by themselves once a
#   package.json names npm in `packageManager`. npm's cache is addressed by the
#   integrity the lockfile records. With a warm cache, `npm ci` installs the
#   engine from the cache instead of reading app/WebEngineTS-0.1.0.tgz, so a
#   tarball replaced without a lockfile update would build and pass against the
#   previous engine. Cold, as here, it fails with EINTEGRITY. Both reproduced
#   with npm 10.9; a cold install of app/ takes about ten seconds.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # `npm ci`, so the job fails when the lockfile and the committed engine
      # tarball disagree (EINTEGRITY), as a clean clone sees it. The lockfile is
      # generated on Windows but already records the linux-x64 native packages,
      # so ci works here (unlike virtual-lab's frontend).
      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Catches Dockerfile drift: the image installs and builds on its own, from
      # the context .dockerignore leaves, with --base-href /editor/.
      - name: Build image
        run: docker build -t webengine-editor:ci .

      # Building the image copies docker/nginx.conf but never parses it; starting
      # nginx does.
      # Then the two things the platform's proxy relies on: the editor under
      # /editor/, with the matching base href, and the health check.
      - name: Smoke-test the image
        run: |
          docker run -d --name editor -p 8080:80 webengine-editor:ci
          timeout 30 bash -c 'until curl -sf localhost:8080/healthz; do sleep 1; done' \
            || { docker logs editor; exit 1; }
          # A step without `shell:` runs as `bash -e`, without pipefail, so the
          # pipeline's status is grep's. A failed curl leaves it nothing to match.
          curl -sf localhost:8080/editor/ | grep -F '<base href="/editor/">'
          docker rm -f editor

  e2e:
    name: e2e (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Chromium on Linux converts file names through the C library's locale. In
      # a non-UTF-8 one, a non-ASCII name becomes empty — the wizard scenario's
      # "Будова атома" folder then resolves to its parent. Runners default to
      # C.UTF-8; this keeps the result from depending on that.
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        working-directory: app
        run: npm ci

      # The base href the Docker image builds with, served under the same path, so
      # run.mjs's default URL (http://localhost:8044/editor/) and its reloads mean
      # here what they mean against the container. No scenario needs nginx itself.
      - name: Build for /editor/
        working-directory: app
        run: npm run build -- --base-href /editor/

      - name: Serve it at /editor/
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          ln -s "$GITHUB_WORKSPACE/app/dist/browser" "$RUNNER_TEMP/site/editor"
          nohup python3 -m http.server 8044 --bind 127.0.0.1 --directory "$RUNNER_TEMP/site" \
            > "$RUNNER_TEMP/http.log" 2>&1 &
          timeout 30 bash -c 'until curl -sf localhost:8044/editor/ >/dev/null; do sleep 1; done' \
            || { cat "$RUNNER_TEMP/http.log"; exit 1; }

      # Locally, run.mjs borrows Playwright from testv/virtual-lab/e2e and drives
      # the installed Edge; a runner has neither. Playwright goes outside app/ so
      # the editor's package.json and lockfile stay as they are. 1.56.1 is the
      # version this suite was verified with on Linux; virtual-lab's e2e is on a
      # newer one, and following it is a one-line change once a run proves it.
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/playwright" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium

      - name: e2e
        working-directory: app
        env:
          E2E_PLAYWRIGHT_DIR: ${{ runner.temp }}/playwright
          E2E_BROWSER_CHANNEL: chromium
        run: npm run e2e

      # include-hidden-files: the action skips anything under a folder whose name
      # starts with a dot, the search path itself included. Without it, `.shots/`
      # uploads nothing at all.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-shots
          path: .shots/
          include-hidden-files: true
          retention-days: 7
