# docker/nginx.conf — the editor's own static server.
#
# Deliberately bare: security headers, the CSP and caching policy belong to the
# platform's nginx in front of this one, so there is one place they are decided.
#
# No gzip here on purpose. The platform's nginx rewrites index.html (it stamps a
# CSP nonce onto the import map with sub_filter), and sub_filter cannot see into
# a compressed upstream response. The front nginx compresses for the browser.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /editor {
        return 301 /editor/;
    }

    # SPA fallback, under the same /editor/ prefix the platform proxies.
    location /editor/ {
        try_files $uri $uri/ /editor/index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
